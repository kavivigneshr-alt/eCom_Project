<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account Login / Register</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 1rem; }
    .auth-box { background: #ffffff; width: 100%; max-width: 400px; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .tabs { display: flex; border-bottom: 2px solid #e2e8f0; margin-bottom: 1.5rem; }
    .tab-btn { flex: 1; text-align: center; padding: 0.75rem; cursor: pointer; font-weight: 600; color: #64748b; }
    .tab-btn.active { color: #2563eb; border-bottom: 2px solid #2563eb; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.875rem; margin-bottom: 0.35rem; color: #334155; }
    input { width: 100%; padding: 0.65rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; }
    button { width: 100%; background: #2563eb; color: #fff; border: none; padding: 0.75rem; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 0.5rem; }
    button:hover { background: #1d4ed8; }
    .msg { margin-top: 1rem; font-size: 0.875rem; text-align: center; min-height: 1.25rem; }
    .home-link { display: block; text-align: center; margin-top: 1rem; font-size: 0.85rem; color: #64748b; text-decoration: none; }
    .home-link:hover { color: #2563eb; }
  </style>
</head>
<body>
  <div class="auth-box">
    <div class="tabs">
      <div class="tab-btn active" id="tab-login" onclick="switchTab('login')">Sign In</div>
      <div class="tab-btn" id="tab-register" onclick="switchTab('register')">Register</div>
    </div>

    <!-- Login Form -->
    <form id="form-login" onsubmit="submitAuth(event, 'login')">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="login-email" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" required />
      </div>
      <button type="submit">Sign In</button>
    </form>

    <!-- Register Form -->
    <form id="form-register" style="display: none;" onsubmit="submitAuth(event, 'register')">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="reg-name" required />
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="reg-email" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="reg-password" required />
      </div>
      <button type="submit">Create Account</button>
    </form>

    <div class="msg" id="status-message"></div>
    <a href="/" class="home-link">&larr; Back to Store</a>
  </div>

  <script>
    function switchTab(mode) {
      document.getElementById('form-login').style.display = mode === 'login' ? 'block' : 'none';
      document.getElementById('form-register').style.display = mode === 'register' ? 'block' : 'none';
      document.getElementById('tab-login').className = 'tab-btn ' + (mode === 'login' ? 'active' : '');
      document.getElementById('tab-register').className = 'tab-btn ' + (mode === 'register' ? 'active' : '');
      document.getElementById('status-message').textContent = '';
    }

    async function submitAuth(e, mode) {
      e.preventDefault();
      const status = document.getElementById('status-message');
      status.style.color = '#475569';
      status.textContent = 'Submitting...';

      const payload = mode === 'login'
        ? {
            email: document.getElementById('login-email').value,
            password: document.getElementById('login-password').value
          }
        : {
            name: document.getElementById('reg-name').value,
            email: document.getElementById('reg-email').value,
            password: document.getElementById('reg-password').value
          };

      try {
        const res = await fetch(`/api/auth/${mode}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Request failed');

        if (mode === 'login') {
          localStorage.setItem('auth_token', data.token);
          localStorage.setItem('user_info', JSON.stringify(data.user));
          status.style.color = 'green';
          status.textContent = 'Signed in successfully! Redirecting...';
          setTimeout(() => { window.location.href = '/'; }, 1000);
        } else {
          status.style.color = 'green';
          status.textContent = 'Account created! Please sign in.';
          switchTab('login');
        }
      } catch (err) {
        status.style.color = '#dc2626';
        status.textContent = err.message;
      }
    }
  </script>
</body>
</html>
